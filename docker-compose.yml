version: '3.8'

services:
  api:
    build:
      context: ./receiver
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/order-sync.sqlite
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
      - HUBSPOT_PIPELINE_ID=${HUBSPOT_PIPELINE_ID}
      - HUBSPOT_DEAL_STAGE_ID=${HUBSPOT_DEAL_STAGE_ID}
      - HUBSPOT_ORDER_ID_PROPERTY=${HUBSPOT_ORDER_ID_PROPERTY:-external_order_id}
      - HUBSPOT_REQUEST_TIMEOUT_MS=${HUBSPOT_REQUEST_TIMEOUT_MS:-10000}
      - HUBSPOT_MAX_ATTEMPTS=${HUBSPOT_MAX_ATTEMPTS:-4}
    volumes:
      - sqlite-data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  sqlite-data:
